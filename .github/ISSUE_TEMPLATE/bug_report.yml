name: Bug report
description: Report something that isn't working as expected
labels: ['bug']
body:
    - type: textarea
      id: description
      attributes:
          label: Describe the bug
          description: What happened, and what you expected to happen instead.
          placeholder: 'When I do X, Y happens instead of Z.'
      validations:
          required: true

    - type: textarea
      id: steps
      attributes:
          label: Steps to reproduce
          description: Step-by-step instructions to reproduce the behavior.
          placeholder: |
              1. Open a base and switch it to the Gallery layout
              2. ...
      validations:
          required: true

    - type: textarea
      id: base
      attributes:
          label: Base definition
          description: The relevant part of the `.base` file (filters, properties and the gallery view's options), and the frontmatter of an affected note.
          render: yaml

    - type: textarea
      id: screenshots
      attributes:
          label: Screenshots or screen recordings
          description: If applicable, add screenshots or recordings, and any error from the developer console.

    - type: input
      id: plugin-version
      attributes:
          label: Plugin version
          description: 'Found in Settings → Community plugins → Media Manager'
          placeholder: '0.1.0'
      validations:
          required: true

    - type: input
      id: obsidian-version
      attributes:
          label: Obsidian version
          description: 'Found in Settings → About'
          placeholder: '1.13.0'
      validations:
          required: true

    - type: dropdown
      id: os
      attributes:
          label: Operating system
          options:
              - Windows
              - macOS
              - Linux
              - iOS
              - Android
      validations:
          required: true

    - type: dropdown
      id: embed
      attributes:
          label: Where is the base shown?
          options:
              - Opened as a .base file
              - Embedded in a note
              - Both

    - type: checkboxes
      id: other-plugins
      attributes:
          label: Reproducible with other plugins disabled?
          description: Try disabling all other community plugins and see if the issue persists.
          options:
              - label: I have tested with all other plugins disabled and the issue still occurs.
