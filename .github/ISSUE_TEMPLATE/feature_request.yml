name: Feature request
description: Suggest a new feature or improvement
labels: ['enhancement']
body:
    - type: textarea
      id: problem
      attributes:
          label: Problem or use case
          description: What problem does this solve, or what use case does it address?
          placeholder: 'I want to be able to ...'
      validations:
          required: true

    - type: textarea
      id: solution
      attributes:
          label: Proposed solution
          description: Describe how you'd like this to work. Include mockups or screenshots if helpful.
      validations:
          required: true

    - type: textarea
      id: alternatives
      attributes:
          label: Alternatives considered
          description: Workarounds or other approaches you have tried, such as the built-in Cards layout.

    - type: textarea
      id: context
      attributes:
          label: Additional context
          description: Any other context, screenshots or examples.
