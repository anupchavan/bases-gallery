name: Node.js build

on:
    push:
        branches: ['**']
    pull_request:
        branches: ['**']

permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest

        strategy:
            matrix:
                # Maintained LTS lines that eslint 10 and stylelint 18 support.
                # See https://nodejs.org/en/about/previous-releases
                node-version: [22.x, 24.x, 26.x]

        steps:
            - uses: actions/checkout@v7
            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v7
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: 'npm'
            - run: npm ci
            - run: npm run build
            - run: npm run lint
            - run: npm test
